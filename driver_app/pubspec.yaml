name: faceapp
description: Face recognition app with Firebase
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.3.6

  # Functionality
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.12.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  image: ^4.2.0
  provider: ^6.1.2
  permission_handler: ^11.3.1
  animations: ^2.1.1
  http: ^1.2.0
  mailer: ^7.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/mobilefacenet.tflite
    - assets/background.jpg
    - assets/bg.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1