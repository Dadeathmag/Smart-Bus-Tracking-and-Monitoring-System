<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 400px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: white;
        }

        .login-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
        }

        .btn-custom {
            width: 100%;
            border-radius: 8px;
        }

        .role-badge {
            font-size: 0.8rem;
            margin-left: 5px;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {{ firebase_config | tojson }};

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.loginUser = async function() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorEl = document.getElementById("error");
            errorEl.textContent = "";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const token = await userCredential.user.getIdToken(true);

                // Create session
                const sessionRes = await fetch("/sessionLogin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ idToken: token })
                });

                if (!sessionRes.ok) {
                    let errMsg = "Session login failed";
                    try {
                        const errData = await sessionRes.json();
                        if (errData && errData.error) errMsg = errData.error;
                    } catch (_) {}
                    throw new Error(errMsg);
                }

                // Get role redirect
                const response = await fetch("/redirect", {
                    credentials: "include"
                });

                if (!response.ok) {
                    let errMsg = "Unable to fetch redirect route";
                    try {
                        const errData = await response.json();
                        if (errData && errData.error) errMsg = errData.error;
                    } catch (_) {}
                    throw new Error(errMsg);
                }

                const data = await response.json();
                if (!data || typeof data.redirect !== "string" || !data.redirect.startsWith("/")) {
                    throw new Error("Invalid redirect response from server");
                }
                window.location.assign(data.redirect);

            } catch (error) {
                errorEl.textContent = error.message || "Login failed";
            }
        }
    </script>
</head>

<body>

<div class="login-card">
    <h3 class="login-title">
        🔐 System Login
    </h3>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email">
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter password">
    </div>

    <button onclick="loginUser()" class="btn btn-primary btn-custom">
        Login
    </button>

    <p id="error" class="text-danger mt-3 text-center"></p>

    <hr>

    <div class="text-center text-muted">
        Admin & User Access
    </div>
</div>

</body>
</html>
