{% extends "base.html" %}

{% block content %}

<h2>Add Bus</h2>

<form method="POST" action="/admin/buses/add" enctype="multipart/form-data" class="form-card">

    <label>Bus Name</label>
    <input type="text" name="name" required>

    <label>Bus Number</label>
    <input type="text" name="bus_number" required>

    <label>Student Limit</label>
    <input type="number" name="student_limit" min="40" required>

    <label>Bus Permit Image</label>
    <input type="file" name="permit_photo" accept="image/*">

    <button type="submit">Add Bus</button>

</form>

{% endblock %}
