{% extends "base.html" %}

{% block content %}

<h2>Manage Buses</h2>

<table class="bus-table">
    <thead>
        <tr>
            <th>Name</th>
            <th>Number</th>
            <th>Limit</th>
            <th>Strength</th>
            <th>Status</th>
            <th>Actions</th>
            <th></th>
        </tr>
    </thead>

    <tbody>
        {% for busid,bus in buses %}
        <tr>
            <td>{{ bus.name }}</td>
            <td>{{ bus.bus_number }}</td>
            <td>{{ bus.student_limit }}</td>
            <td>{{ bus.current_strength }}</td>
            <td>{{ bus.status }}</td>
            <td>
                <a href="/admin/buses/manage/{{ busid }}" 
                class="manage-btn">Manage</a>
            </td>
            <td>
                <form method="POST" action="/admin/buses/delete/{{ busid }}" 
                      onsubmit="return confirm('Are you sure you want to delete this bus?');">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
